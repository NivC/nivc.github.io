{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button type="button" aria-label="Toggle navigation"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    <div class="masthead__logos">
      <a href="https://ece.technion.ac.il/" class="masthead__logo">
        <img src="{{ base_path }}/images/technion_ece_logo.png" alt="Technion ECE">
      </a>
      <a href="https://www.technion.ac.il/en/" class="masthead__logo">
        <img src="{{ base_path }}/images/technion_logo.png" alt="Technion">
      </a>
    </div>
  </div>
</div>
